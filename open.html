<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RoadReady: Open the app</title>
<meta name="theme-color" content="#161b2e">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .open { padding-top: 56px; padding-bottom: 72px; display: grid; gap: 16px; max-width: 640px; }
  .open img { width: 72px; height: 72px; border-radius: 16px; }
  .open h1 { font-size: clamp(30px, 5vw, 40px); line-height: 1.15; margin: 8px 0 0; }
  .open p { margin: 0; color: var(--muted); font-size: 18px; }
  .button {
    justify-self: start; margin-top: 8px;
    background: var(--amber); color: var(--on-amber);
    font-weight: 600; text-decoration: none;
    padding: 14px 22px; border-radius: 12px;
  }
  .button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .small { font-size: 15px !important; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./"><img src="icon.png" alt="">RoadReady</a>
    <nav aria-label="Main">
      <a href="./#support">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </div>
</header>
<div class="road" role="presentation"></div>

<main class="wrap open">
  <img src="icon.png" alt="RoadReady app icon">
  <h1 id="title">Open RoadReady</h1>
  <p id="body">Tap the button to carry on in the app.</p>
  <a class="button" id="open" href="com.endlesstech.roadready://login-callback">Open RoadReady</a>
  <p class="small" id="help">Need a hand? Email <a href="mailto:support@beaconsec.ca">support@beaconsec.ca</a>.</p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>RoadReady is an independent study aid made by Endless Technologies. It is not connected to any government or licensing agency.</p>
    <nav aria-label="Footer">
      <a href="./">Home</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </div>
</footer>

<script>
// Links in RoadReady's account emails land here. Supabase has already done its
// part (an email confirmation is saved before this page loads) and passes a
// one-time code, which only the app can use. Hand it on, and say plainly what
// happened, because on a computer the app can't open.
(function () {
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var kind = q.get('for');
  var error = q.get('error') || h.get('error');
  var errorCode = q.get('error_code') || h.get('error_code') || '';
  var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  var app = 'com.endlesstech.roadready://login-callback' + location.search;

  var title = document.getElementById('title');
  var body = document.getElementById('body');
  var button = document.getElementById('open');
  button.href = app;

  function say(t, b, showButton, label) {
    title.textContent = t;
    body.textContent = b;
    button.hidden = !showButton;
    if (label) button.textContent = label;
  }

  if (error) {
    if (errorCode === 'otp_expired') {
      say('This link has expired',
        'Links in our emails work once and only for a short time. If you already confirmed your email, just sign in. ' +
        'Otherwise, open RoadReady and ask for a new email from the sign-in screen.', false);
    } else {
      say('That link didn’t work',
        'Open RoadReady and try again from the sign-in screen. If it keeps happening, email us.', false);
    }
    return;
  }

  if (kind === 'confirm') {
    if (phone) {
      say('Your email is confirmed',
        'Open RoadReady to finish signing in. Your progress will back up from now on.', true, 'Open RoadReady');
    } else {
      say('Your email is confirmed',
        'You’re all set. Open RoadReady on your phone and sign in with your email and password.', false);
    }
  } else if (kind === 'reset') {
    if (phone) {
      say('Choose a new password',
        'Open RoadReady to set your new password.', true, 'Open RoadReady');
    } else {
      say('Open this link on your phone',
        'Password resets finish in the app. Open the email on the phone where you asked for the reset, and tap the link there.', false);
    }
  } else if (!phone) {
    say('Open RoadReady on your phone', 'RoadReady is a phone app for iPhone and Android.', false);
  }

  // On a phone, try the app straight away; the button stays for when the
  // browser asks first or blocks it.
  if (phone && !button.hidden && q.get('code')) {
    setTimeout(function () { location.href = app; }, 400);
  }
})();
</script>
</body>
</html>
